name: Windows executable

# Builds pst_testgen.exe. On a version tag (v1.2.3) it is attached to a GitHub
# release; a manual run just uploads it as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        env:
          PY: python
        run: scripts\build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: pst-testgen-exe
          path: dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
