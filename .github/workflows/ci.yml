name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # pst-testgen needs Windows; the Outlook part itself cannot run on CI
    # runners, so this covers the plan, the deletions and the manifest.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest
